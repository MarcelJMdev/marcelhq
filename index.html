<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marcel — marcelhq.de</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] } } }
    }
  </script>
</head>
<body class="bg-neutral-950 text-neutral-100 font-sans antialiased min-h-screen flex flex-col justify-between selection:bg-neutral-800">

  <!-- Header -->
  <header class="max-w-2xl mx-auto w-full px-6 pt-10 flex justify-between items-center">
    <a href="/" class="font-extrabold text-lg tracking-tight text-white hover:opacity-80 transition-opacity">
      marcel<span class="text-neutral-500">hq</span>.de
    </a>
    <span class="px-3 py-1 rounded-full border border-neutral-800 bg-neutral-900/80 text-xs font-semibold text-neutral-400 flex items-center gap-1.5">
      🇦🇹 Österreich
    </span>
  </header>

  <!-- Main Hero -->
  <main class="max-w-2xl mx-auto w-full px-6 py-20 my-auto space-y-8">
    <div class="space-y-3">
      <h1 class="text-5xl sm:text-7xl font-extrabold text-white tracking-tight">
        Marcel
      </h1>
      <p class="text-xl text-neutral-400 font-medium">
        Digital HQ & Content Creator.
      </p>
    </div>

    <!-- Quick Navigation Button -->
    <div class="pt-4">
      <a href="/social" class="inline-flex items-center justify-center w-full sm:w-auto py-4 px-8 rounded-2xl bg-white text-neutral-950 font-bold text-center hover:bg-neutral-200 transition-all text-sm shadow-lg">
        Social Links ansehen →
      </a>
    </div>
  </main>

  <!-- E-Ride Pro Button -->
<a href="/eride" class="group flex items-center justify-between p-4 rounded-2xl bg-neutral-900 border border-neutral-800/80 hover:border-emerald-500/50 transition-all mt-4">
  <div class="flex items-center gap-4">
    <div class="w-10 h-10 rounded-xl bg-emerald-950/80 border border-emerald-800/40 flex items-center justify-center text-emerald-400 font-extrabold text-sm">
      ⚡
    </div>
    <div>
      <div class="text-sm font-bold text-white group-hover:text-emerald-400 transition-colors">E-Ride Pro SS 3.0</div>
      <div class="text-xs font-mono text-neutral-400">Specs & Bike-Showcase</div>
    </div>
  </div>
  <span class="text-xs text-neutral-500 group-hover:text-white transition-colors">Ansehen →</span>
</a>

  <!-- Footer -->
  <footer class="max-w-2xl mx-auto w-full px-6 py-8 text-xs text-neutral-600 flex justify-between">
    <span>© 2026 Marcel</span>
    <span>marcelhq.de</span>
  </footer>

</body>
</html>
