<!DOCTYPE html>
<html lang="de" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marcel — marcelhq.de</title>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Fonts: Plus Jakarta Sans & Syne (für den Namen) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      theme: { 
        extend: { 
          fontFamily: { 
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            display: ['"Syne"', 'sans-serif']
          } 
        } 
      }
    }
  </script>

  <style>
    /* Krasse Pop-In Aufplopp-Animation */
    .animate-pop-in {
      opacity: 0;
      transform: scale(0.92) translateY(20px);
      animation: popIn 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    @keyframes popIn {
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    /* Subtiler Glanz-Effekt auf dem Namen */
    .text-glow {
      text-shadow: 0 0 30px rgba(255, 255, 255, 0.15);
    }
  </style>
</head>
<body class="bg-neutral-950 text-neutral-100 font-sans antialiased min-h-screen flex flex-col justify-between selection:bg-neutral-800 overflow-x-hidden">

  <!-- Ambient Light Effect (Subtiler weiß/grauer Lichtkegel oben) -->
  <div class="fixed inset-0 pointer-events-none -z-10 overflow-hidden">
    <div class="absolute -top-40 left-1/2 -translate-x-1/2 w-[600px] h-[350px] bg-white/5 blur-[140px] rounded-full"></div>
  </div>

  <!-- Header -->
  <header class="animate-pop-in max-w-2xl mx-auto w-full px-6 pt-10 flex justify-between items-center" style="animation-delay: 0.05s;">
    <a href="/" class="font-extrabold text-lg tracking-tight text-white hover:opacity-80 transition-opacity font-display">
      marcel<span class="text-neutral-500">hq</span>.de
    </a>
    <span class="px-3 py-1 rounded-full border border-neutral-800 bg-neutral-900/80 text-xs font-semibold text-neutral-400 flex items-center gap-1.5 shadow-sm">
      🇦🇹 Österreich
    </span>
  </header>

  <!-- Main Content -->
  <main class="max-w-2xl mx-auto w-full px-6 py-12 my-auto space-y-8">
    
    <!-- Hero Section -->
    <div class="space-y-4">
      
      <!-- Name "Marcel" mit Syne-Font, Farbverlauf & Aufploppen -->
      <h1 class="animate-pop-in font-display text-6xl sm:text-8xl font-extrabold tracking-tight text-glow bg-clip-text text-transparent bg-gradient-to-b from-white via-neutral-100 to-neutral-400 select-none" style="animation-delay: 0.15s;">
        Marcel
      </h1>

      <!-- Info-Badges: 16y & Männlich -->
      <div class="animate-pop-in flex flex-wrap items-center gap-2 pt-1" style="animation-delay: 0.25s;">
        <span class="px-3.5 py-1.5 rounded-xl bg-neutral-900 border border-neutral-800/80 text-xs font-mono font-semibold text-neutral-300 shadow-sm flex items-center gap-1.5">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
          16y
        </span>
        <span class="px-3.5 py-1.5 rounded-xl bg-neutral-900 border border-neutral-800/80 text-xs font-mono font-semibold text-neutral-300 shadow-sm">
          ♂ Männlich
        </span>
      </div>

    </div>

    <!-- Interactive Cards / Buttons -->
    <div class="space-y-3 pt-2">
      
      <!-- Primary CTA: Socials Button -->
      <a href="/social" class="animate-pop-in group flex items-center justify-between py-4 px-6 rounded-2xl bg-white text-neutral-950 font-bold hover:bg-neutral-200 transition-all duration-300 text-sm shadow-xl transform hover:-translate-y-0.5 active:scale-[0.98]" style="animation-delay: 0.35s;">
        <span class="flex items-center gap-2.5">
          <span>Social Media & Links</span>
        </span>
        <span class="text-neutral-500 group-hover:translate-x-1 transition-transform">→</span>
      </a>

      <!-- Bike Button / Card (E-Ride Pro SS 3.0) -->
      <a href="/eride" class="animate-pop-in group relative block p-5 rounded-2xl bg-neutral-900/70 border border-neutral-800 hover:border-emerald-500/40 hover:bg-neutral-900 transition-all duration-300 shadow-lg transform hover:-translate-y-0.5 active:scale-[0.98] overflow-hidden" style="animation-delay: 0.45s;">
        <!-- Glow-Effekt im Hintergrund -->
        <div class="absolute -right-10 -bottom-10 w-32 h-32 bg-emerald-500/10 blur-2xl rounded-full group-hover:bg-emerald-500/20 transition-all"></div>
        
        <div class="relative z-10 flex items-center justify-between">
          <div class="flex items-center gap-4">
            <!-- E-Ride Logo Icon -->
            <div class="w-11 h-11 rounded-xl overflow-hidden bg-black border border-neutral-800 flex items-center justify-center p-0 shrink-0 group-hover:scale-105 transition-transform duration-300">
              <img src="https://external-content.duckduckgo.com/iu/?u=https%3A%2F%2Feridepro.co.nz%2Fcdn%2Fshop%2Ffiles%2FERIDE_LOGO_b09c14ef-c68a-480f-9f41-5d97b3a8613a.jpg%3Fv%3D1754978287%26width%3D750&f=1&nofb=1&ipt=523f20d0575d4925a588dfc11368d6d058a61767b03c83e40d1d3eb48f92f690" alt="E-Ride Pro Logo" class="w-full h-full object-cover">
            </div>
            <div>
              <div class="flex items-center gap-2">
                <span class="text-sm font-bold text-white group-hover:text-emerald-400 transition-colors">E-Ride Pro SS 3.0</span>
                <span class="px-2 py-0.5 rounded-full bg-emerald-950 border border-emerald-800/50 text-[10px] font-mono font-bold text-emerald-400">21,5 PS</span>
              </div>
              <p class="text-xs text-neutral-400 mt-0.5 font-mono">Bike Showcase & Specs</p>
            </div>
          </div>
          <span class="text-xs font-semibold text-neutral-500 group-hover:text-white group-hover:translate-x-1 transition-all">Ansehen →</span>
        </div>
      </a>

    </div>
  </main>

  <!-- Footer -->
  <footer class="animate-pop-in max-w-2xl mx-auto w-full px-6 py-8 text-xs text-neutral-600 flex justify-between" style="animation-delay: 0.55s;">
    <span>© 2026 Marcel</span>
    <span>marcelhq.de</span>
  </footer>

</body>
</html>
