<!DOCTYPE html>
<html lang="de" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marcel — marcelhq.de</title>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Fonts: Plus Jakarta Sans & Syne -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      theme: { 
        extend: { 
          fontFamily: { 
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            display: ['"Syne"', 'sans-serif']
          } 
        } 
      }
    }
  </script>

  <style>
    /* Ultra-cleane, sanfte und langsamere Animation */
    .animate-pop-in {
      opacity: 0;
      transform: translateY(24px) scale(0.97);
      filter: blur(4px);
      animation: smoothGlide 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes smoothGlide {
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0px);
      }
    }

    /* Subtiler Glanz-Effekt */
    .text-glow {
      text-shadow: 0 0 35px rgba(255, 255, 255, 0.18);
    }

    /* Range Slider Styling */
    input[type="range"] {
      accent-color: #10b981;
    }
  </style>
</head>
<body class="bg-neutral-950 text-neutral-100 font-sans antialiased min-h-screen flex flex-col justify-between selection:bg-neutral-800 overflow-x-hidden">

  <!-- Ambient Light Effect (Hintergrund leuchten) -->
  <div class="fixed inset-0 pointer-events-none -z-10 overflow-hidden">
    <div class="absolute -top-40 left-1/2 -translate-x-1/2 w-[650px] h-[380px] bg-white/4 blur-[150px] rounded-full"></div>
  </div>

  <!-- FLOATING MINI-PLAYER ANZEIGE (OBEN RECHTS) -->
  <div id="mini-player" class="fixed top-5 right-5 z-50 hidden transition-all duration-500 ease-out">
    <div class="flex items-center gap-3 p-2.5 pl-4 bg-neutral-900/80 backdrop-blur-xl border border-neutral-800/80 rounded-2xl shadow-2xl hover:border-emerald-500/40 transition-all duration-500">
      
      <!-- Live Equalizer / Playing Icon -->
      <div class="w-8 h-8 rounded-xl bg-black/60 border border-neutral-800 flex items-center justify-center shrink-0">
        <svg class="w-4 h-4 text-emerald-400" fill="currentColor" viewBox="0 0 24 24">
          <path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.02 8.52-.6 11.64 1.32.42.18.48.66.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141 4.38-1.38 9.78-.72 13.5 1.56.36.24.54.84.241 1.26zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.18-1.38-.72-.18-.6.18-1.2.72-1.38 4.26-1.26 11.28-1.02 15.72 1.62.54.3.72 1.02.42 1.56-.3.42-1.02.6-1.56.3z"/>
        </svg>
      </div>

      <!-- Info -->
      <div class="min-w-0 max-w-[120px] sm:max-w-[150px]">
        <div id="mini-title" class="text-xs font-bold text-white truncate">Traum V2</div>
        <div id="mini-artist" class="text-[10px] text-neutral-400 font-mono truncate">Ufo361</div>
      </div>

      <!-- Quick Controls -->
      <div class="flex items-center gap-1 pl-1">
        <button onclick="togglePlay()" id="mini-play-btn" class="p-2 rounded-xl bg-emerald-500 text-neutral-950 hover:bg-emerald-400 transition-all active:scale-95 duration-300">
          <svg id="mini-play-icon" class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          <svg id="mini-pause-icon" class="w-3.5 h-3.5 hidden" fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>
        <button onclick="nextSong()" class="p-1.5 rounded-lg text-neutral-400 hover:text-white transition-colors duration-300">
          <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24"><path d="M16 18h-2V6h2zm-3.5-6L4 6v12z"/></svg>
        </button>
      </div>

    </div>
  </div>

  <!-- PERSISTENTES AUDIO ELEMENT -->
  <audio id="global-audio" preload="metadata"></audio>

  <!-- Header -->
  <header class="animate-pop-in max-w-2xl mx-auto w-full px-6 pt-10 flex justify-between items-center shrink-0" style="animation-delay: 0.1s;">
    <a href="/" class="font-extrabold text-lg tracking-tight text-white hover:opacity-80 transition-opacity font-display">
      marcel<span class="text-neutral-500">hq</span>.de
    </a>
    <span class="px-3 py-1 rounded-full border border-neutral-800 bg-neutral-900/80 text-xs font-semibold text-neutral-400 flex items-center gap-1.5 shadow-sm">
      🇦🇹 Österreich
    </span>
  </header>

  <!-- DYNAMISCHER CONTAINER FOR ROUTING (Hier liegt der Fix für die Zentrierung!) -->
  <main id="app-main" class="max-w-2xl mx-auto w-full px-6 py-10 flex-grow flex flex-col justify-center space-y-8">
    
    <!-- Hero Section -->
    <div class="space-y-4 w-full">
      <h1 class="animate-pop-in font-display text-6xl sm:text-8xl font-extrabold tracking-tight text-glow bg-clip-text text-transparent bg-gradient-to-b from-white via-neutral-100 to-neutral-400 select-none" style="animation-delay: 0.25s;">
        Marcel
      </h1>

      <!-- Badges -->
      <div class="animate-pop-in flex flex-wrap items-center gap-2 pt-1" style="animation-delay: 0.4s;">
        <span class="px-3.5 py-1.5 rounded-xl bg-neutral-900 border border-neutral-800/80 text-xs font-mono font-semibold text-neutral-300 shadow-sm flex items-center gap-1.5">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
          16y
        </span>
        <span class="px-3.5 py-1.5 rounded-xl bg-neutral-900 border border-neutral-800/80 text-xs font-mono font-semibold text-neutral-300 shadow-sm">
          ♂ Männlich
        </span>
      </div>
    </div>

    <!-- ORIGINALER SOCIAL & E-RIDE BEREICH + PLAYER -->
    <div class="space-y-3.5 pt-2 w-full">
      
      <!-- Social Media Button (Original) -->
      <a href="/social" class="animate-pop-in group flex items-center justify-between py-4 px-6 rounded-2xl bg-white text-neutral-950 font-bold hover:bg-neutral-200 transition-all duration-500 text-sm shadow-xl transform hover:-translate-y-0.5 active:scale-[0.98]" style="animation-delay: 0.55s;">
        <span class="flex items-center gap-2.5">
          <span>Social Media & Links</span>
        </span>
        <span class="text-neutral-500 group-hover:translate-x-1 transition-transform duration-500">→</span>
      </a>

      <!-- E-Ride Pro SS 3.0 Card (Original) -->
      <a href="/eride" class="animate-pop-in group relative block p-5 rounded-2xl bg-neutral-900/70 border border-neutral-800 hover:border-emerald-500/40 hover:bg-neutral-900 transition-all duration-500 shadow-lg transform hover:-translate-y-0.5 active:scale-[0.98] overflow-hidden" style="animation-delay: 0.7s;">
        <div class="absolute -right-10 -bottom-10 w-32 h-32 bg-emerald-500/10 blur-2xl rounded-full group-hover:bg-emerald-500/20 transition-all duration-500"></div>
        
        <div class="relative z-10 flex items-center justify-between">
          <div class="flex items-center gap-4">
            <div class="w-11 h-11 rounded-xl overflow-hidden bg-black border border-neutral-800 flex items-center justify-center p-0 shrink-0 group-hover:scale-105 transition-transform duration-500">
              <img src="https://external-content.duckduckgo.com/iu/?u=https%3A%2F%2Feridepro.co.nz%2Fcdn%2Fshop%2Ffiles%2FERIDE_LOGO_b09c14ef-c68a-480f-9f41-5d97b3a8613a.jpg%3Fv%3D1754978287%26width%3D750&f=1&nofb=1&ipt=523f20d0575d4925a588dfc11368d6d058a61767b03c83e40d1d3eb48f92f690" alt="E-Ride Pro Logo" class="w-full h-full object-cover">
            </div>
            <div>
              <div class="flex items-center gap-2">
                <span class="text-sm font-bold text-white group-hover:text-emerald-400 transition-colors duration-500">E-Ride Pro SS 3.0</span>
                <span class="px-2 py-0.5 rounded-full bg-emerald-950 border border-emerald-800/50 text-[10px] font-mono font-bold text-emerald-400">21,5 PS</span>
              </div>
              <p class="text-xs text-neutral-400 mt-0.5 font-mono">Bike Showcase & Specs</p>
            </div>
          </div>
          <span class="text-xs font-semibold text-neutral-500 group-hover:text-white group-hover:translate-x-1 transition-all duration-500">Ansehen →</span>
        </div>
      </a>

      <!-- Haupt-Music-Player Card -->
      <div id="main-player-card" class="animate-pop-in relative p-5 rounded-2xl bg-neutral-900/70 border border-neutral-800 shadow-lg overflow-hidden space-y-4 w-full" style="animation-delay: 0.85s;">
        <div class="absolute -left-10 -top-10 w-36 h-36 bg-emerald-500/10 blur-2xl rounded-full pointer-events-none"></div>

        <div class="relative z-10 flex items-center justify-between gap-3">
          <div class="flex items-center gap-3.5 min-w-0">
            <div class="w-11 h-11 rounded-xl bg-neutral-950 border border-neutral-800 flex items-center justify-center shrink-0">
              <svg class="w-6 h-6 text-emerald-400" fill="currentColor" viewBox="0 0 24 24">
                <path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.02 8.52-.6 11.64 1.32.42.18.48.66.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141 4.38-1.38 9.78-.72 13.5 1.56.36.24.54.84.241 1.26zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.18-1.38-.72-.18-.6.18-1.2.72-1.38 4.26-1.26 11.28-1.02 15.72 1.62.54.3.72 1.02.42 1.56-.3.42-1.02.6-1.56.3z"/>
              </svg>
            </div>
            <div class="min-w-0">
              <div id="song-title" class="text-sm font-bold text-white truncate">Traum V2</div>
              <div id="song-artist" class="text-xs text-neutral-400 font-mono truncate">Ufo361</div>
            </div>
          </div>

          <div class="relative shrink-0">
            <select id="song-select" onchange="selectSong(this.value)" class="bg-neutral-950 text-neutral-300 text-xs font-semibold px-3 py-1.5 rounded-xl border border-neutral-800 focus:outline-none focus:border-emerald-500/80 cursor-pointer transition-colors">
              <option value="0">Traum V2</option>
              <option value="1">Porsche</option>
              <option value="2">GELD MACHT HAPPY</option>
            </select>
          </div>
        </div>

        <div class="relative z-10 space-y-1">
          <input type="range" id="seek-bar" value="0" min="0" max="100" oninput="seekSong(this.value)" class="w-full h-1.5 bg-neutral-800 rounded-lg appearance-none cursor-pointer">
          <div class="flex justify-between text-[10px] font-mono text-neutral-500 px-0.5">
            <span id="current-time">0:00</span>
            <span id="total-duration">0:00</span>
          </div>
        </div>

        <div class="relative z-10 flex items-center justify-between gap-4 pt-1">
          <div class="flex items-center gap-2">
            <button onclick="prevSong()" class="p-2 rounded-xl text-neutral-400 hover:text-white hover:bg-neutral-800/60 transition-colors duration-300 active:scale-95">
              <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
            </button>

            <button id="play-btn" onclick="togglePlay()" class="p-2.5 rounded-xl bg-emerald-500 text-neutral-950 font-bold hover:bg-emerald-400 hover:scale-105 transition-all duration-300 shadow-md active:scale-95">
              <svg id="play-icon" class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
              <svg id="pause-icon" class="w-5 h-5 hidden" fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
            </button>

            <button onclick="nextSong()" class="p-2 rounded-xl text-neutral-400 hover:text-white hover:bg-neutral-800/60 transition-colors duration-300 active:scale-95">
              <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M16 18h-2V6h2zm-3.5-6L4 6v12z"/></svg>
            </button>
          </div>

          <div class="flex items-center gap-2">
            <svg class="w-4 h-4 text-neutral-500 shrink-0" fill="currentColor" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.02v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
            <input type="range" id="volume-slider" value="80" min="0" max="100" oninput="changeVolume(this.value)" class="w-20 h-1.5 bg-neutral-800 rounded-lg appearance-none cursor-pointer">
          </div>
        </div>
      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer class="max-w-2xl mx-auto w-full px-6 py-8 text-xs text-neutral-600 flex justify-between shrink-0">
    <span class="animate-pop-in" style="animation-delay: 1.0s;">© 2026 Marcel</span>
    <span class="animate-pop-in" style="animation-delay: 1.0s;">marcelhq.de</span>
  </footer>

  <!-- MUSIC PLAYER & SMOOTH ROUTING LOGIC -->
  <script>
    const playlist = [
      { title: "Traum V2", artist: "Ufo361", src: "/songs/traum.mp3" },
      { title: "Porsche", artist: "Ufo361", src: "/songs/porsche.mp3" },
      { title: "GELD MACHT HAPPY", artist: "Ufo361", src: "/songs/geld.mp3" }
    ];

    let currentSongIndex = 0;
    const audio = document.getElementById("global-audio");
    const miniPlayer = document.getElementById("mini-player");

    function formatTime(s) {
      if (isNaN(s)) return "0:00";
      const m = Math.floor(s / 60);
      const sec = Math.floor(s % 60);
      return `${m}:${sec < 10 ? '0' : ''}${sec}`;
    }

    function updatePlayerUI() {
      const song = playlist[currentSongIndex];
      
      const songTitle = document.getElementById("song-title");
      const songArtist = document.getElementById("song-artist");
      const songSelect = document.getElementById("song-select");
      if (songTitle) songTitle.innerText = song.title;
      if (songArtist) songArtist.innerText = song.artist;
      if (songSelect) songSelect.value = currentSongIndex;

      document.getElementById("mini-title").innerText = song.title;
      document.getElementById("mini-artist").innerText = song.artist;

      const mainPlayerCard = document.getElementById("main-player-card");
      if (!mainPlayerCard && !audio.paused) {
        miniPlayer.classList.remove("hidden");
        miniPlayer.style.opacity = "1";
        miniPlayer.style.transform = "translateY(0)";
      } else if (mainPlayerCard) {
        miniPlayer.classList.add("hidden");
      }
    }

    function loadSong(index) {
      currentSongIndex = index;
      audio.src = playlist[currentSongIndex].src;
      updatePlayerUI();
    }

    function togglePlay() {
      if (audio.paused) {
        audio.play().then(() => setPlayState(true)).catch(err => console.log(err));
      } else {
        audio.pause();
        setPlayState(false);
      }
    }

    function setPlayState(isPlaying) {
      const pIcon = document.getElementById("play-icon");
      const pauseIcon = document.getElementById("pause-icon");
      const mPIcon = document.getElementById("mini-play-icon");
      const mPauseIcon = document.getElementById("mini-pause-icon");

      if (isPlaying) {
        if (pIcon) pIcon.classList.add("hidden");
        if (pauseIcon) pauseIcon.classList.remove("hidden");
        if (mPIcon) mPIcon.classList.add("hidden");
        if (mPauseIcon) mPauseIcon.classList.remove("hidden");
        
        if (!document.getElementById("main-player-card")) {
          miniPlayer.classList.remove("hidden");
        }
      } else {
        if (pIcon) pIcon.classList.remove("hidden");
        if (pauseIcon) pauseIcon.classList.add("hidden");
        if (mPIcon) mPIcon.classList.remove("hidden");
        if (mPauseIcon) mPauseIcon.classList.add("hidden");
      }
    }

    function selectSong(index) {
      const wasPlaying = !audio.paused;
      loadSong(parseInt(index));
      if (wasPlaying) {
        audio.play().then(() => setPlayState(true));
      }
    }

    function nextSong() {
      selectSong((currentSongIndex + 1) % playlist.length);
    }

    function prevSong() {
      selectSong((currentSongIndex - 1 + playlist.length) % playlist.length);
    }

    function seekSong(val) {
      if (audio.duration) audio.currentTime = (val / 100) * audio.duration;
    }

    function changeVolume(val) {
      audio.volume = val / 100;
    }

    audio.addEventListener("timeupdate", () => {
      const seekBar = document.getElementById("seek-bar");
      const currentTimeEl = document.getElementById("current-time");
      const totalDurationEl = document.getElementById("total-duration");

      if (audio.duration) {
        if (seekBar) seekBar.value = (audio.currentTime / audio.duration) * 100;
        if (currentTimeEl) currentTimeEl.innerText = formatTime(audio.currentTime);
        if (totalDurationEl) totalDurationEl.innerText = formatTime(audio.duration);
      }
    });

    audio.addEventListener("ended", () => nextSong());

    // GEFIXTER ROUTER: Die Breite (max-w-2xl) bleibt jetzt zu 100% erhalten!
    document.addEventListener("click", (e) => {
      const link = e.target.closest("a");
      if (link && link.origin === window.location.origin && !link.getAttribute("target")) {
        e.preventDefault();
        const href = link.getAttribute("href");
        
        fetch(href)
          .then(res => res.text())
          .then(html => {
            const parser = new DOMParser();
            const doc = parser.parseFromString(html, "text/html");
            const newMain = doc.querySelector("main");
            const currentMain = document.getElementById("app-main");
            
            if (newMain && currentMain) {
              // Wir tauschen nur das Innere aus, behalten aber die Layout-Klassen!
              currentMain.innerHTML = newMain.innerHTML;
              
              // Falls die neue Seite andere Klassen für main hat, übernehmen wir die (z.B. max-w-2xl mx-auto)
              if(newMain.className) {
                currentMain.className = newMain.className;
              }

              window.history.pushState({}, "", href);
              window.scrollTo({ top: 0, behavior: "smooth" });

              const hasMainPlayer = document.getElementById("main-player-card");
              if (!hasMainPlayer && !audio.paused) {
                miniPlayer.classList.remove("hidden");
              } else if (hasMainPlayer) {
                miniPlayer.classList.add("hidden");
                updatePlayerUI();
              }
            } else {
              window.location.href = href;
            }
          })
          .catch(() => window.location.href = href);
      }
    });

    window.addEventListener("popstate", () => location.reload());

    // Init
    loadSong(0);
    audio.volume = 0.8;
  </script>

</body>
</html>
