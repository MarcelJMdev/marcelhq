<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discord — Marcel (zaa_ay)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
        }
      }
    }
  </script>
</head>
<body class="bg-neutral-950 text-neutral-200 font-sans antialiased min-h-screen flex flex-col justify-between">

  <!-- Header -->
  <header class="max-w-2xl mx-auto w-full px-6 pt-8 flex justify-between items-center">
    <a href="/index.html" class="text-xs font-semibold text-neutral-400 hover:text-white transition-colors flex items-center gap-1">
      ← Zurück zu marcelhq.de
    </a>
  </header>

  <!-- Discord Profile Card -->
  <main class="max-w-md mx-auto w-full px-6 py-12 text-center space-y-6">
    
    <div class="w-20 h-20 mx-auto rounded-full bg-indigo-600/20 border border-indigo-500/40 flex items-center justify-center text-indigo-400 font-bold text-2xl shadow-lg shadow-indigo-500/10">
      🎮
    </div>

    <div class="space-y-2">
      <h1 class="text-3xl font-extrabold text-white">Mein Discord</h1>
      <p class="text-sm text-neutral-400">Kopiere meinen Usernamen oder adde mich direkt auf Discord.</p>
    </div>

    <!-- Username Card with Copy Button -->
    <div class="bg-neutral-900 border border-neutral-800 rounded-2xl p-6 space-y-4 shadow-xl">
      <div class="text-xs font-mono text-neutral-500 uppercase tracking-widest">Discord Tag / Username</div>
      
      <div class="text-3xl font-mono font-extrabold text-white tracking-wide">
        zaa_ay
      </div>

      <button id="copyBtn" onclick="copyDiscord()" class="w-full py-3 px-4 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold transition-all transform active:scale-95 shadow-lg shadow-indigo-600/20 text-sm">
        Username kopieren
      </button>
    </div>

    <div class="pt-4">
      <a href="https://discord.com/users/zaa_ay" target="_blank" rel="noopener" class="text-xs text-neutral-500 hover:text-neutral-300 underline">
        Discord App öffnen
      </a>
    </div>

  </main>

  <footer class="text-center py-6 text-xs text-neutral-600">
    marcelhq.de/discord
  </footer>

  <script>
    function copyDiscord() {
      navigator.clipboard.writeText("zaa_ay");
      const btn = document.getElementById("copyBtn");
      btn.innerText = "✓ Kopiert!";
      btn.classList.remove("bg-indigo-600", "hover:bg-indigo-500");
      btn.classList.add("bg-emerald-600");
      
      setTimeout(() => {
        btn.innerText = "Username kopieren";
        btn.classList.remove("bg-emerald-600");
        btn.classList.add("bg-indigo-600", "hover:bg-indigo-500");
      }, 2000);
    }
  </script>
</body>
</html>
